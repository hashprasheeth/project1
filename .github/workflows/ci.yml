name: Untrashify CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        
    - name: Lint with Ruff
      run: |
        ruff check backend/
        
    - name: Build Backend Docker Image
      run: docker build ./backend --file backend/Dockerfile --tag untrashify-backend:latest

  frontend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
        
    - name: Lint with ESLint
      working-directory: ./frontend
      run: npm run lint
      
    - name: Build Frontend Docker Image
      run: docker build ./frontend --file frontend/Dockerfile --tag untrashify-frontend:latest
